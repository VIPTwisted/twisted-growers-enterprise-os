[build]
  base = "app/web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  # Supabase URL + publishable (anon) key are public-by-design client values.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
