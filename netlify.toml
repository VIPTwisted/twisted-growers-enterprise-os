[build]
  base = "app/web"
  # The gates run HERE, not only in GitHub Actions.
  #
  # Actions and Netlify build independently and in parallel, so a failing Action could never
  # stop a ship - every check was advisory. Worse, a CLI deploy bypasses Actions entirely.
  # Running them inside the Netlify build is the only place that catches both paths: if a check
  # exits non-zero the build fails and nothing is published.
  #
  # Order matters. app/web installs first because parse-check needs its esbuild; then the repo
  # root installs eslint and the checks; then the checks run; only then do we build. A doomed
  # bundle is never produced.
  #
  # --include=dev IS LOad-BEARING. Netlify sets NODE_ENV=production for a
  # production build, and npm then SKIPS devDependencies. esbuild, eslint and
  # vite all live there, so parse-check cannot find esbuild, the ratchet cannot
  # find eslint, and the build has no bundler - every push since the repo was
  # reconnected died here with "non-zero exit code: 2" and no other clue.
  # Reproduced exactly by installing a clean clone with NODE_ENV=production.
  # Stated in the command rather than left to an env var, because the command is
  # the thing that has to be right and an env var is one more place to look.
  # `npm run gates`, NOT `npm run check`. Same 37 gates, same order, same fail-fast -
  # the runner PARSES the chain out of `check` so the two can never drift apart. What
  # changes is only what a red build SAYS.
  #
  # Fourteen builds failed across 9-11 Aug 2026 and nobody could name the gate that
  # stopped them. `check` chains 37 gates with `&&`, so the first non-zero exit kills
  # the chain and the last line Netlify prints is its own generic:
  #
  #     Build script returned non-zero exit code: 2
  #
  # The failing gate's message is thousands of lines up, and the gates that never ran
  # look exactly like the ones that passed. Diagnosis meant cloning the repo and
  # running the chain by hand, which is why two days of red went unread. The gate was
  # doing its job. The PIPELINE was swallowing the reason.
  #
  # The runner names the failing gate in a banner at the bottom, next to Netlify's own
  # error, lists what never ran as UNKNOWN rather than passing, and prints the exact
  # one-line command to reproduce it locally.
  #
  # It also reports DEGRADED gates on a GREEN build. schema-baseline, docs-vs-database
  # and page-architecture need a database, there is none here, and they answer PASS
  # without verifying anything. They are honest about it - but that honesty scrolled
  # past unread inside a passing build, which is precisely how a vacuous gate survives.
  command = "npm install --include=dev --no-audit --no-fund && cd ../.. && npm install --include=dev --no-audit --no-fund && npm run gates && cd app/web && npm run build"
  publish = "dist"

[build.environment]
  # PIN THE RUNTIME. Nothing pinned it before - no .nvmrc, no engines field -
  # so Netlify's image chose, and the choice could change under us between one
  # build and the next. The build passes locally and in a clean clone of main
  # and failed here, which is what an unpinned runtime looks like: the thing
  # that breaks is never the thing you changed.
  NODE_VERSION = "22"





  # Supabase URL + publishable (anon) key are public-by-design client values.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
