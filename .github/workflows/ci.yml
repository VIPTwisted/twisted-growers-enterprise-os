name: Gates

# There was no linter, no type checking, no tests and no CI on this repository. Every rule in
# CLAUDE.md was enforced only by whoever remembered it, which is why a stray `)}` shipped to
# production, a dashboard silently returned zero tiles, and a database password reached a public
# commit. These jobs turn the owner's rules into build failures.
#
# Deliberately calibrated to be adoptable: the number check is a ratchet against a recorded
# baseline, and ESLint runs on rules tied to defects this project has actually suffered. A gate
# that fails on everything from day one is a gate people switch off.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONEY_TEST_PGURL: postgresql://postgres@localhost:5432/postgres
      # THE GATES THAT NEED THE REAL DATABASE NEED IT HERE, TOO.
      #
      # MONEY_TEST_PGURL above is the throwaway service container two lines up. It is NOT the
      # production database and was never meant to be: money-grain builds its own fixture in it.
      #
      # Seven gates read production — migration-drift, report-contract, page-architecture,
      # docs-vs-database, schema-baseline, apex-registry, no-duplicate-rows. Until this line
      # existed, none of them could reach it, so every one answered PASS (DEGRADED) and exited
      # zero. The migration-drift ratchet was set to `missing: 0` on 11 Aug and never once ran:
      # 14 migrations reached production with no file in this repository and the build stayed
      # green through all of them.
      #
      # THE POOLER HOST, NOT THE DIRECT ONE. Supabase's direct db.<ref>.supabase.co host is
      # IPv6-only and GitHub's runners are IPv4-only, so a direct string times out here and
      # times out in a way that looks like a firewall, not a config error. The secret holds the
      # aws-0-<region>.pooler.supabase.com string, on a read-only role.
      #
      # NO FALLBACK IS CORRECT. If the secret is absent the gates fail closed and say so. A gate
      # that cannot see the database is not a gate that passed.
      PGURL: ${{ secrets.TG_GATES_PGURL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # theme-lock diffs against the merge base, so it needs history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Two package.json files by design: the repo-level one holds the gates, app/web holds the
      # application. Keeping them separate means tooling never alters the front-end build —
      # app/web/src belongs to one owner and must not be touched by CI changes.
      - name: Install gate tooling
        run: npm install --no-audit --no-fund

      - name: Install app dependencies
        working-directory: app/web
        run: npm install --no-audit --no-fund

      # ---- FIRST, because everything below it assumes the files still exist ----------
      # budz.jsx went to zero bytes on 8 Aug 2026 and every other gate read green:
      # they all look for something WRONG inside a file, and an empty file contains
      # nothing wrong. This one asks whether the file is still there.
      - name: Source intact
        run: node tools/checks/source-intact.mjs

      # ---- Rule 9 / I1: THE THEME IS LOCKED -------------------------------------------
      - name: Theme lock
        run: node tools/checks/theme-lock.mjs

      # ---- A stray token renders as visible text. The bar is zero warnings. ------------
      - name: Parse check (zero warnings)
        run: node tools/checks/parse-check.mjs

      # ---- Rules A1 / A2 / G1: no frozen business figures in dashboards ---------------
      - name: No new hardcoded numbers
        run: node tools/checks/no-hardcoded-numbers.mjs

      # ---- The linter this repo never had --------------------------------------------
      # A ratchet, not a cliff. ERRORS always fail. WARNINGS may never exceed the
      # recorded baseline, so a new one goes red naming the rule while the 20
      # outstanding ones — hook dependencies and empty catches, each needing a
      # judgement call on live code — do not hold the build hostage.
      # I first wired --max-warnings 0 with 24 warnings outstanding: a gate that is
      # red on arrival, which is how a gate gets switched off.
      - name: ESLint (errors block, warnings ratchet)
        run: node tools/checks/eslint-ratchet.mjs

      # ---- Rule F2 / A3: a crash must be contained, reported, and unable to flood ----
      # Item 1 proved this app can throw: a hook called after an early return
      # crashed React the moment data arrived, and with no boundary that
      # white-screened the whole OS leaving no record.
      - name: Error boundaries
        run: node tools/checks/error-boundaries.mjs

      # ---- Preferences: local optimism must never hide a rejected account write -----
      - name: Preference integrity (account saves disclose failures)
        run: node tools/checks/preference-integrity.mjs

      # ---- Rule A3: a navigation failure must never be silent -------------------------
      # An address matching nothing used to fall through to the Control Tower in
      # silence, so a stale bookmark looked identical to arriving home on purpose.
      - name: Routing
        run: node tools/checks/routing.mjs

      # ---- Rules A1 / A3: a movement is judged by its target, or not judged ----------
      # The sparkline and the delta each decided sentiment themselves and
      # disagreed, so "Never submitted for testing +4.1" rendered as a green
      # rising line — unsellable product increasing, shown as a win.
      - name: Trend sentiment
        run: node tools/checks/trend-sentiment.mjs

      # ---- Rule E6: the bridge must never again need a database credential -----------
      # Routing it through ai_bridge_jobs is what made it authenticate with the
      # publishable key. Closing the anon hole killed it, and the tempting fix is
      # to re-grant anon — reopening an internet-reachable write path.
      - name: Bridge asked directly
        run: node tools/checks/bridge-direct.mjs

      # ---- Phase 0: recoverability. Written by another agent, never wired. ------------
      # Caught by all-checks-wired below on its first real run — the repo held 6
      # migration files describing 4 tables while production held 244. A baseline
      # that has gone stale is that same failure wearing a hat.
      - name: Schema baseline is fresh
        run: node tools/checks/schema-baseline-fresh.mjs

      # ---- Standard rule 6: what runs in production is in the repository -------------
      # Measured 11 Aug 2026: supabase/migrations held ONE file while
      # supabase_migrations.schema_migrations held 590 rows. `apply_migration` writes
      # Supabase's own history and does NOT write a file here, so every agent doing schema
      # work opens the gap on every call — database_governance, tag_event_ledger,
      # v_data_inventory and apex_split_nesting_cost_control were all live in production
      # with no source in this repository. A schema you cannot rebuild from the repository
      # is one you cannot restore, review, or reason about.
      # It ALSO flags a migration NAME recorded twice: one apply_migration call that day was
      # recorded at 154152 and again at 154220, 28 seconds apart. The tool retried, and it
      # was harmless only because that SQL happened to be idempotent.
      # No database here, so it answers PASS (DEGRADED) and says what it did not check —
      # the pattern netlify.toml already documents for schema-baseline, docs-vs-database
      # and page-architecture. It verifies for real in `npm run check` locally.
      - name: Migrations in production exist in this repository
        run: node tools/checks/migration-drift.mjs

      # ---- The guards must still CATCH, not merely run --------------------------------
      # all-checks-wired proves a guard runs; it says itself it does not check whether
      # the guard is any good. On 8 Aug 2026 the SQL hook and the grep below carried the
      # same false positive — the hook locked a function, the grep held this workflow red
      # continuously — and neither had a single test. This runs fixtures through both and
      # fails if they disagree, because fixing one copy would not have fixed the other.
      - name: Guard fixtures (guards still catch what they claim)
        run: node tools/checks/guard-fixtures.mjs

      # ---- The PARSERS must still read what they claim --------------------------------
      # guard-fixtures proves the guards catch. Nothing proved the parsers read.
      # Both parsers turn a document into a number that reaches a state filing, and
      # both shipped with no test in CI:
      #   report_fixtures  - a footer row once became a $1,692,460 sale; 396 grouped
      #                      rows were dropped; every plant was counted twice.
      #   coa_fixtures     - the limit-of-quantitation column was read as a
      #                      measurement, putting four potency figures 0.2% above
      #                      Metrc. Caught by comparing against Metrc, not by any test.
      # A suite that only runs when someone remembers is hope, not enforcement.
      - name: Set up Python (for the parser fixtures)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parser dependencies
        run: pip install --quiet openpyxl xlrd

      - name: Report parser fixtures (Metrc exports still read correctly)
        run: python tools/report_fixtures.py

      - name: Certificate parser fixtures (potency still reads correctly)
        run: python tools/coa_fixtures.py

      # ---- Rule E6 / security: a credential must never reach a file -------------------
      # 23 permission entries carrying live admin keys, JWTs and signed URLs accumulated
      # in a OneDrive-synced config over several days with nothing watching.
      - name: Secret scan (working tree, not just commits)
        run: node tools/checks/secret-scan.mjs

      # ---- Every rule is enforced by something, or is counted as hope -----------------
      - name: Rule ledger (unenforced rules are counted, not forgotten)
        run: node tools/checks/rule-ledger.mjs

      # ---- Rule L8: the period label and the queried figures cannot diverge -----------
      - name: Date range integrity (no silent all-time fallback)
        run: node tools/checks/date-range-integrity.mjs

      # ---- Money grain: an invoice total is true once, never once per tag ----------
      - name: Money grain (line reports cannot multiply invoice totals)
        run: node tools/checks/money-grain.mjs

      - name: Migration pin travels with the files
        run: node tools/checks/migration-pin-travels.mjs

      # ---- Measure grain: numeric does not mean additive -----------------------------
      - name: Report measure grain (only verified row-grain measures can total)
        run: node tools/checks/report-measure-grain.mjs

      # ---- Metrc authority: read failures and empty mirrors are not source facts ------
      - name: Metrc reads fail closed (no false absence or invented scan figures)
        run: node tools/checks/metrc-read-integrity.mjs

      # ---- Moisture truth: residual is not a water sensor; basis must be explicit -----
      - name: Moisture basis, editable goal, and returned save receipt
        run: node tools/checks/moisture-truth-integrity.mjs

      # ---- Rule E4 / C2: counting an aggregate view counts the wrong thing ------------
      # HANDOFF.md §5 lists it among the five ways this project has actually broken:
      # count(*) on v_stock_on_hand returns the number of STREAMS, not packages. No
      # error, no blank screen — just a smaller number that reads as true. Derives the
      # aggregate views from the committed schema dump and checks SQL and supabase-js
      # alike, because the front end never writes SQL.
      - name: Aggregate views are summed, not counted
        run: node tools/checks/aggregate-count.mjs

      # ---- The bridge's schema map must describe the real database --------------------
      # Written by another agent on 8 Aug 2026 and never wired, so it enforced nothing —
      # caught by all-checks-wired, which is the entire reason that guard exists. A stale
      # schema map sends the desktop assistant at columns that no longer exist.
      - name: Schema map is fresh
        run: node tools/checks/schema-map-fresh.mjs

      # ---- Rule A3, where A3 does not reach ------------------------------------------
      # A3 makes a tool explain its own gaps. It does not make anyone LOOK. Our schema
      # dump has been shipping with "NOT CAPTURED: permission denied for schema cron"
      # written in it — honest, obedient to A3, and read by nobody, so the dump silently
      # contains no scheduled jobs at all. A failure that is recorded and never raised is
      # still a silent failure. Ratchets against a baseline of the known ones.
      - name: Silent failures (recorded, never raised)
        run: node tools/checks/silent-failures.mjs

      # ---- Rule G2 / G1: a licence is a database row, never a literal -----------------
      # Two licences today, MC281714 and MP281909. A renewal, a transfer or a third site
      # makes every literal silently wrong — and "is this ours?" is the hinge of the
      # whole ownership chain under rule C0. A ratchet: the count may fall, never rise.
      - name: No new hardcoded licence numbers
        run: node tools/checks/literal-licences.mjs

      # ---- Rule F4 / I3: the owner is not an engineer ---------------------------------
      # "Unit of measure", not "UOM". This rule breaks nothing visibly — it just makes
      # the product unusable by the person it was built for, one label at a time, and
      # nobody ever files a bug for a label.
      - name: No abbreviations in user-facing text
        run: node tools/checks/ui-language.mjs

      # ---- Rule A1 and the dashboard standard: NEVER a fabricated line ----------------
      # The only failure mode here that looks BETTER than the truth. A seeded array reads
      # as history; a demo sparkline reads as a healthy trend. A fabricated 130 g/plant
      # figure was once presented as fact.
      - name: Nothing invented reaches the screen
        run: node tools/checks/no-fabricated-data.mjs

      # ---- Rule C1: a tile is a CLAIM and must open to the items behind it ------------
      # The owner's most repeated rule — stated three times in CLAUDE.md — and until
      # 8 Aug 2026 nothing checked it once.
      - name: Every tile opens to its records
        run: node tools/checks/tile-drills.mjs

      # ---- The Command Center delivery's own validator (Agent B, 11 Aug 2026) --------
      # Static, no database: every flow stage drills in place (including stage 6,
      # "In transit"), drill rows come from v_stock_proof and never the view measured
      # at 30.7 s with 0/429 manifests matched, no literal numeric series reads as
      # live data, and the honesty chips and narrative-lane guards stay in place.
      # WIRED HERE THE SAME DAY IT WAS WRITTEN, because registering it in
      # package.json alone turned all-checks-wired red inside the Netlify build and
      # stopped the 791855d deploy — the exact failure all-checks-wired exists to
      # catch, caught on the guard's own author.
      - name: Command Center delivery validator
        run: node tools/checks/validate-command-center.mjs

      # ---- Rules L6 / §7 / C3a / I4 / J7: the reports were governed by nothing ---------
      # Pages have five gates. Reports had none, and the owner asked for this specifically.
      # Measured 11 Aug 2026: 102 reports whose source carries a date and whose view drops
      # it, so they cannot be pulled by date range (L6) — computed by v_report_standard
      # since 8 Aug and READ BY NOBODY, which is the watchdog's own class of defect. 113
      # reports no role can open. 93 reports sitting in the left rail instead of the
      # Reports dropdown (I4). 17 filter and column lists frozen into JSX (§7 — "a
      # hard-coded filter list means every new filter is a code change, so it never
      # happens"). 15 rooms rendered without their department and ZERO uses of
      # room_qualified (J7). None of the four canonical C3a reasons for an absent
      # certificate can be produced by this front end at all.
      # A ratchet, because every one of those is above zero today and a gate red on arrival
      # gets switched off. The source rules run here; L6 and I4 need nav_registry and
      # answer DEGRADED where there is no database.
      - name: Reports meet their contract
        run: node tools/checks/report-contract.mjs

      # ---- Rule I2 / A3: a button that does nothing lies about the product ------------
      # 332 buttons, 0 inert, baselined at zero — so a new dead control fails the build.
      # A disabled button with a title is NOT a finding: that is A3 done correctly.
      # To a non-technical owner an inert button reads as broken, or worse as "it worked
      # and I cannot see the result".
      - name: No dead controls
        run: node tools/checks/dead-controls.mjs

      # ---- Every pre-built question must reach a real answer -------------------------
      # The owner clicked "What was backordered today?" and got a confident,
      # well-written answer that was worthless: the question matched no branch in
      # budzAnswer, so it fell through and was improvised. 53 questions are offered
      # as buttons; a question with no branch is a promise the platform cannot keep,
      # and the failure is invisible because the answer still looks like an answer.
      - name: Budz questions all route
        run: node tools/checks/budz-questions.mjs

      # ---- The guard that guards the guards -------------------------------------------
      # Four checks were written on 7 Aug and never wired, so they enforced
      # nothing while looking like enforcement. This fails if any check in
      # tools/checks is missing from this file, so a guard written tomorrow
      # cannot be silently left out. Exemptions live in the check, with reasons.
      - name: All guards are wired into CI
        run: node tools/checks/rules-in-sync.mjs

      # Wired 8 Aug 2026 - written by a sibling agent and caught unwired by
      # all-checks-wired, which is exactly the failure that check exists for.
      - name: literal-licences
        run: node tools/checks/literal-licences.mjs
      - name: no-fabricated-data
        run: node tools/checks/no-fabricated-data.mjs
      - name: tile-drills
        run: node tools/checks/tile-drills.mjs
      - name: ui-language
        run: node tools/checks/ui-language.mjs
      # Three functions ran in production with no source here at all.
      - name: Edge functions are versioned
        run: node tools/checks/edge-functions-versioned.mjs

      # ---- A source that changed must be deployed, or say why not -------------------
      # edge-functions-versioned checks a function HAS a source file. It passed while
      # 20 of 25 sources differed from production, including apex-sync, whose four
      # fixes sat undeployed for 4h38m until a human read the timestamps by hand.
      - name: Edge function source matches its deploy
        run: node tools/checks/edge-function-drift.mjs

      # The bridge's schema map is generated. Nothing regenerated it, and a map
      # that has drifted is worse than none - it is confidently wrong.
      - name: Schema map is fresh
        run: node tools/checks/schema-map-fresh.mjs
      # Owner ruling 8 Aug 2026, twice in capitals: DO NOT EVER USE ONE TEMPLATE FOR
      # EVERY PAGE. 522 report pages were all rendered by ReportScreen at App.jsx:1952,
      # which receives a table name and nothing else - so Employee Notes was given a
      # harvest date filter. This fails if the generic renderer spreads, if a module
      # imports another module, if a page LAYOUT lands in the shared ui/ folder, or if
      # pages are added without deciding what kind of page they are.
      - name: Page architecture - primitives are shared, layouts are not
        run: node tools/checks/page-architecture.mjs
      # Bit twice on 8 Aug 2026: patches.css (269 lines, imported by main.jsx, never added)
      # and roster/hrdash/kiosk (746 lines, untracked). source-intact.mjs counts TRACKED files
      # so it is blind to a file that was never added. A clean clone is the only build that
      # matters, because that is what Netlify does.
      - name: Nothing the app imports may be missing from git
        run: node tools/checks/untracked-source.mjs
      # Written by another agent and never wired, so it enforced nothing - caught by
      # all-checks-wired, which is the entire reason that guard exists. It was ALSO
      # untracked, which is what pushed untracked-source.mjs to start scanning
      # tools/checks: a guard living on one laptop is as dangerous as app code doing so.
      # The owner clicked a pre-built question and got a confident answer with no branch
      # behind it; this asserts every one of the 53 questions reaches a real answer.
      - name: Budz pre-built questions reach a real answer
        run: node tools/checks/budz-questions.mjs
      # Owner standing rule, 8 Aug 2026: MIT / Google / Microsoft standard or beat them,
      # nothing under par. Accessibility is a HARD LAUNCH BLOCKER at both companies and this
      # platform had no check at all. A click handler on a <div> is invisible to a keyboard
      # and silent to a screen reader; kiosk.jsx is a shared floor terminal with gloved hands.
      # Ratcheted at the measured debt (36 keyboard-unreachable controls, 133 unlabelled
      # fields) because a gate that is red on arrival gets switched off.
      - name: Accessibility - a control a keyboard cannot reach is not a control
        run: node tools/checks/accessibility.mjs
      # NOTHING in tools/checks read PROSE, so a whole class was unguarded. On 7 Aug 2026 the
      # owner settled the licence mapping with a screenshot; the live systems were fixed that
      # day; docs/09_METRC_API_ACCESS.md still read "MC157557 cultivation" two days later, in
      # the body of an email to api-info@metrc.com. 157557 is his USER ID, not a licence. A
      # regulator would have received it. CONTRADICTIONS.md had flagged it and nothing acted.
      # Neither Google nor Microsoft gates documentation against production data. This does.
      - name: Documents agree with the database (licences)
        run: node tools/checks/docs-vs-database.mjs
      # The owner's engineering standard. Holds the mechanical parts only -
      # a guard that has been hollowed out still prints its name and enforces nothing.
      # A lesson written in LESSONS.md on 7 Aug shipped for two more days because
      # nothing read it at the moment it mattered. This does.
      - name: Prompts do not contradict the locked facts
        run: node tools/checks/locked-facts-in-prompts.mjs
      - name: The standard is held
        run: node tools/checks/standard-held.mjs
      # The Apex entity registry drives the whole sync from database rows, and every one of
      # them was typed by a person reading a 17,512-line contract. Five were wrong on 9 Aug
      # 2026 - two root keys that abort an entity, a read declaring a write scope, a required
      # entity guaranteed to 403 on every run, and an hourly full pull of a 3-credit-per-item
      # endpoint at roughly 307k credits a month against a 100k allowance. None of them would
      # have failed loudly. This diffs the rows against the committed spec, needs no API key
      # and costs no credits.
      - name: Apex registry agrees with the committed contract
        run: node tools/checks/apex-registry-vs-spec.mjs
      # ONE ROW PER ORDER. apex_raw is append-only by owner ruling, so a revised order keeps
      # its earlier snapshot: on 29 Aug 2026 that was 2,063 shipping-order rows behind 1,860
      # real orders. Every view reading a row AS AN ORDER counted 203 of them twice, put 24
      # into two link_status groups at once, and double-counted $910,560.63 of order value.
      # Nothing errored - the reconciliation just answered with more money than the business
      # had. This asserts count(*) = count(distinct order key) with no tolerance, because one
      # duplicated order is one order counted twice.
      - name: Apex order grain - one row per order
        run: node tools/checks/apex-order-grain.mjs
      # verify_jwt is per-function and CANNOT be recovered from the source. 13 of the 26
      # functions run verify_jwt=false and authenticate in the body; deploying one of them
      # with the default locks out its real callers, and the reverse publishes an
      # authenticated endpoint. Deploys here are still manual - pasting a whole file through
      # an agent's context into an MCP call - so the manifest is the only thing standing
      # between that and a silent auth change.
      - name: Deployed manifest declares verify_jwt for every function
        run: node tools/checks/deployed-manifest-complete.mjs
      # Edge functions had NO scope analysis of any kind. parse-check covers four front-end
      # files with esbuild, which assumes an unresolved identifier is a global; ESLint's
      # no-undef was scoped to app/web/src. On 10 Aug 2026 apex-sync shipped a reference to
      # an undeclared MAX_RATE_RETRIES inside its 429 handler - a ReferenceError that would
      # only fire while Apex was rate-limiting, on the one path whose job is to survive that.
      # These 26 functions run unattended on service-role credentials.
      - name: Edge functions are scope-analysed
        run: node tools/checks/edge-function-lint.mjs
      # Wired by Agent G, not its author: all-checks-wired went red because this guard was in
      # package.json and not here, and a red build blocks everybody. Verified passing first
      # (7 registered tables, 0 duplicates) so wiring it could not turn CI red for the wrong
      # reason. If the placement is wrong, move it — the point was not to leave it unwired.
      - name: No duplicate rows against a registered key
        run: node tools/checks/no-duplicate-rows.mjs
      - run: node tools/checks/all-checks-wired.mjs

      # ---- Rule E1 / E6 / H2: dangerous SQL must not reach a migration ---------------
      # The PreToolUse hook blocks an agent from issuing these interactively. This catches
      # anything that arrives by another route.
      - name: Forbidden SQL patterns
        run: |
          set -euo pipefail
          fail=0

          # SCAN WHAT THIS PUSH CHANGES, NOT THE WHOLE ARCHIVE.
          #
          # These three rules scanned `.` recursively — every .sql file in the repo,
          # forever. Migrations from 5-7 Aug 2026 contain `drop view`, `grant ... to anon`
          # and deletes from forensic tables, written BEFORE those rules existed. They are
          # applied history: immutable, already in production, and editing them would be
          # both meaningless and forbidden. So the archive guaranteed a red build in
          # perpetuity.
          #
          # Measured 15 Aug 2026: 25 consecutive failures since 13 Aug 04:39. Last green
          # run 10 Aug. Five days.
          #
          # That is not a safety net, it is noise — and it did real damage today. Netlify
          # went down for four deploys, deploy-watch detected it correctly and failed six
          # times running, and nobody looked, because GitHub failure mail from this repo
          # had meant nothing for five days. The owner found the outage from a screenshot.
          #
          # This same file already documents this same lesson from 8 Aug 2026, eight lines
          # below: "This step therefore exited 1 on every run, so the Gates workflow was red
          # continuously and stopped meaning anything." It was fixed for prose then and
          # broke again for history now. Twice is a pattern, so this fixes the shape.
          #
          # NOTHING IS RELAXED. The rules below are unchanged and still fail the build. What
          # changes is their SCOPE: a violation must be one this push introduces. Two other
          # layers already cover the archive and neither is touched — the database's own
          # trigger refuses any view drop at runtime, and tools/hooks/guard-sql.mjs blocks
          # one at authoring time before it can ever reach a file.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -n "$BASE" ]; then
            mapfile -t SQL < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.sql')
          else
            mapfile -t SQL < <(git ls-files '*.sql')   # first commit: nothing to diff against
          fi
          if [ ${#SQL[@]} -eq 0 ]; then
            echo "Forbidden SQL patterns: no .sql added or changed in this push — nothing to scan."
            exit 0
          fi
          echo "Scanning ${#SQL[@]} changed .sql file(s):"
          printf '  %s\n' "${SQL[@]}"
          # Rule E1 — destroyed mv_department_dashboard three times.
          # WIDENED 8 Aug 2026: this required the word CASCADE, so a plain `drop view` and
          # `drop materialized view` both passed CI untouched — and a matview cannot be
          # restored with CREATE OR REPLACE at all. The database's own trigger refuses ANY
          # view drop; CI now agrees with it and with tools/hooks/guard-sql.mjs.
          # Comment lines are excluded: this file and the migrations DISCUSS the rule, and a
          # check that fires on prose held the build red for a day on 8 Aug.
          if grep -niE 'drop[[:space:]]+(materialized[[:space:]]+)?view' \
               "${SQL[@]}" | grep -viE ':[0-9]+:[[:space:]]*--' ; then
            echo "::error::RULE E1 — a DROP VIEW was found. Use CREATE OR REPLACE VIEW."
            fail=1
          fi
          # Rule E6 — 36 views once leaked package tags and dollar figures.
          # TIGHTENED 8 Aug 2026. This read 'grant[^;]*[[:space:]]to[[:space:]][^;]*anon',
          # which matched the WORDS grant/to/anon anywhere on a line — including English
          # prose. It hit three comments that DESCRIBE the problem:
          #   fortifications.sql:69          "EXECUTE was granted to PUBLIC ... so anon"
          #   baseline_live_schema.sql:5565  "Postgres grants EXECUTE to PUBLIC ... the anon"
          #   baseline_live_schema.sql:5572  same
          # None is a GRANT statement. This step therefore exited 1 on every run, so the
          # Gates workflow was red continuously and stopped meaning anything — the same
          # false-positive class that locked tg_nightly_platform_check() via the PreToolUse
          # hook. Requiring a privilege keyword after `grant` separates statement from prose:
          # verified 5/5 real GRANT shapes still caught, 0 of 3 prose lines caught.
          if grep -niE 'grant[[:space:]]+(all|select|insert|update|delete|truncate|references|trigger|usage|execute|create|connect|temporary|temp)\b[^;]*[[:space:]]to[[:space:]][^;]*\banon\b' \
               "${SQL[@]}" ; then
            echo "::error::RULE E6 — 'grant ... to anon' found. Grant to authenticated instead."
            fail=1
          fi
          # Rule H2 — watchdog_findings silently lost 57 rows on 7 Aug 2026.
          # DROP TABLE added 8 Aug 2026. Removing 57 rows was blocked; removing the entire
          # table was not. The most destructive of the three verbs was the one missing.
          if grep -niE '(delete[[:space:]]+from|truncate|drop[[:space:]]+table([[:space:]]+if[[:space:]]+exists)?)[[:space:]]+(public\.)?(watchdog_findings|issue_decisions|cost_input_history|metrc_corrections|moisture_loss_entries)' \
               "${SQL[@]}" | grep -viE ':[0-9]+:[[:space:]]*--' ; then
            echo "::error::RULE H2 — deletion of, or from, an append-only forensic table."
            fail=1
          fi
          exit $fail

      # ---- Rule 6 of the security section: secrets must never reach a commit ----------
      # A working database password was committed in .mcp.json and pushed to main.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # advisory until the historical finding is resolved
